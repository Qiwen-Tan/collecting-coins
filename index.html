<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coin Collector</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
<style>
body { margin: 0; background: #f4f0df; color: #234735; font-family: "Space Grotesk", sans-serif; }
main { max-width: 600px; margin: auto; padding: 25px 16px; animation: appear .4s; }
h1 { font-size: clamp(32px, 7vw, 48px); margin: 0; }
p { line-height: 1.6; }
canvas { width: 100%; display: block; border: 4px solid #234735; box-sizing: border-box; }
button { background: #234735; color: white; border: 0; padding: 12px 18px; margin-top: 12px; font: inherit; cursor: pointer; }
button:hover { background: #527448; }
button:active { transform: scale(.95); }
button:focus-visible { outline: 3px solid #bd7525; outline-offset: 3px; }
#stats { font-weight: bold; }
@keyframes appear { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { main { animation: none; } }
</style>
</head>
<body>
<main>
<h1>Coin Collector</h1>
<p>Move with arrow keys or the buttons. Collect gold coins.<br>Grey blocks stop you. Moving red blocks cost one life!</p>
<p id="stats"></p>
<canvas id="game" width="600" height="360" aria-label="Coin collecting game board"></canvas>
<nav aria-label="Game controls">
<button onclick="move(-1,0)" aria-label="Left">←</button>
<button onclick="move(0,-1)" aria-label="Up">↑</button>
<button onclick="move(0,1)" aria-label="Down">↓</button>
<button onclick="move(1,0)" aria-label="Right">→</button>
<button onclick="restart()">Restart</button>
</nav>
<p id="message" role="status"></p>
</main>
<script>
const pen = document.getElementById("game").getContext("2d");
const stats = document.getElementById("stats");
const message = document.getElementById("message");
const walls = [[3,1], [3,2], [6,3], [6,4]];
let x, y, level, score, lives, coins, bricks, won;

function blocked(x, y) {
  return x < 0 || x > 9 || y < 0 || y > 5 ||
    walls.some(([a,b]) => a === x && b === y);
}

function loadLevel() {
  x = y = 0;
  lives = 3;
  coins = [[2,0], [8,0], [1,5], [5,5], [9,5]];
  bricks = [[5,1,1], [4,4,-1], [8,2,-1], [1,3,1]].slice(0, level + 1);
  draw();
}

function square(x, y, color, gap) {
  pen.fillStyle = color;
  pen.fillRect(x * 60 + gap, y * 60 + gap, 60 - gap * 2, 60 - gap * 2);
}

function draw() {
  pen.fillStyle = ["#d4e3b6", "#efd3a3", "#c0cee4"][level - 1];
  pen.fillRect(0, 0, 600, 360);
  pen.strokeStyle = "#23473520";
  for (let row = 0; row < 6; row++)
    for (let col = 0; col < 10; col++)
      pen.strokeRect(col * 60, row * 60, 60, 60);
  walls.forEach(([a,b]) => square(a, b, "#667268", 5));
  bricks.forEach(([a,b]) => square(a, b, "#bd5143", 10));
  pen.fillStyle = "#e9ac24";
  coins.forEach(([a,b]) => {
    pen.beginPath();
    pen.arc(a * 60 + 30, b * 60 + 30, 13, 0, Math.PI * 2);
    pen.fill();
  });
  square(x, y, "#234735", 14);
  pen.fillStyle = "white";
  pen.fillRect(x * 60 + 20, y * 60 + 20, 5, 5);
  pen.fillRect(x * 60 + 35, y * 60 + 20, 5, 5);
  stats.textContent = `Level ${level}/3 • Score ${score} • Lives ${lives}`;
}

function checkHit() {
  if (!bricks.some(([a,b]) => a === x && b === y)) return;
  lives--;
  x = y = 0;
  message.textContent = "Ouch! Back to the start.";
  if (lives === 0) {
    score = (level - 1) * 50;
    loadLevel();
    message.textContent = "No lives left. Level restarted!";
  }
}

function move(dx, dy) {
  if (won || blocked(x + dx, y + dy)) return;
  x += dx;
  y += dy;
  checkHit();
  const coin = coins.findIndex(([a,b]) => a === x && b === y);
  if (coin !== -1) {
    coins.splice(coin, 1);
    score += 10;
  }
  if (coins.length === 0) {
    if (level < 3) {
      level++;
      loadLevel();
      message.textContent = "Next level! Watch out for red bricks.";
    } else {
      won = true;
      message.textContent = "You won! All 15 coins collected!";
    }
  }
  draw();
}

function restart() {
  level = 1;
  score = 0;
  won = false;
  loadLevel();
  message.textContent = "Collect all five coins to finish each level.";
}

// Bricks move horizontally and bounce off walls.
setInterval(() => {
  if (won || document.hidden) return;
  bricks.forEach(brick => {
    if (blocked(brick[0] + brick[2], brick[1])) brick[2] *= -1;
    brick[0] += brick[2];
  });
  checkHit();
  draw();
}, 700);

document.addEventListener("keydown", event => {
  const keys = { ArrowLeft: [-1,0], ArrowRight: [1,0], ArrowUp: [0,-1], ArrowDown: [0,1] };
  if (keys[event.key]) {
    event.preventDefault();
    move(...keys[event.key]);
  }
});

restart();
</script>
</body>
</html>
